<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Email Capture</title>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js" async defer></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      max-width: 520px;
      margin: 0 auto;
    }
    #qr-reader { width: 100%; max-width: 300px; margin: 20px 0; }
    button { padding: 10px 20px; font-size: 1em; margin-top: 12px; }
    #sheet-bar {
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 12px;
      box-sizing: border-box;
      text-align: center;
    }
    #sheet-name { font-weight: bold; }
    .muted { color: #666; font-size: 0.9em; }
    #status {
      width: 100%;
      box-sizing: border-box;
      margin-top: 16px;
      padding: 12px;
      border-radius: 6px;
      text-align: center;
      font-size: 1.1em;
      display: none;
    }
    #status.saving { display: block; background: #eee; color: #333; }
    #status.saved  { display: block; background: #e6f4ea; color: #137333; font-weight: bold; }
    #status.failed { display: block; background: #fce8e6; color: #b00; font-weight: bold; }
    #scanned { font-family: monospace; font-size: 0.95em; word-break: break-all; }
    #reconnect-button { display: none; }
    #error { color: #b00; margin-top: 12px; text-align: center; }
  </style>
</head>
<body>
  <h2>Scan QR Code to Capture Email</h2>

  <div id="sheet-bar">
    <div>Saving to: <span id="sheet-name">no sheet chosen yet</span></div>
    <button id="choose-button">Choose Google Sheet</button>
    <div class="muted">You'll sign in with Google and pick a sheet from your Drive.</div>
  </div>

  <div id="qr-reader"></div>

  <div id="status"></div>
  <button id="retry-button" style="display: none;">Capture Another</button>
  <button id="reconnect-button">Reconnect to Google and retry</button>
  <div id="error"></div>

  <script>
    // ---- From your Google Cloud project ----
    const CLIENT_ID = "1095889947363-9sn265jhc224v6qicpfahfdh160018j0.apps.googleusercontent.com";
    const API_KEY = "AIzaSyBgO288xQACOzklSQ3Z7OZ9y0xRMqIP9qE";
    const APP_ID = "1095889947363"; // Cloud project number
    // ----------------------------------------

    const SCOPE = "https://www.googleapis.com/auth/drive.file";

    let tokenClient = null;
    let accessToken = null;
    let pickerReady = false;
    let qrCodeScanner = null;
    let scanHandled = false;
    let flushing = false;

    const $ = (id) => document.getElementById(id);

    // Anything scanned goes here FIRST, and is only removed once the Sheets
    // API confirms the write. Nothing is lost if auth or the network fails.
    let queue = JSON.parse(localStorage.getItem("qrQueue") || "[]");
    let sheet = JSON.parse(localStorage.getItem("qrSheet") || "null");

    const saveQueue = () => localStorage.setItem("qrQueue", JSON.stringify(queue));

    function showError(msg) { $("error").textContent = msg || ""; }

    function setStatus(kind, html) {
      const el = $("status");
      el.className = kind || "";
      el.innerHTML = html || "";
    }

    function renderSheet() {
      $("sheet-name").textContent = sheet ? sheet.name : "no sheet chosen yet";
      $("choose-button").textContent = sheet ? "Change Sheet" : "Choose Google Sheet";
    }

    function needsReconnect(show) {
      $("reconnect-button").style.display = show ? "block" : "none";
    }

    function queueStatus() {
      if (queue.length === 0) return;
      setStatus("failed",
        "NOT saved yet — " + queue.length + " scan" + (queue.length === 1 ? "" : "s") +
        " waiting.<br>Tap Reconnect below, then they'll be sent.");
      needsReconnect(true);
    }

    // --- Google auth ---

    function initTokenClient() {
      if (tokenClient || !window.google || !google.accounts) return;
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPE,
        callback: (resp) => {
          if (resp.error) {
            showError("Sign-in failed: " + resp.error);
            queueStatus();
            return;
          }
          showError("");
          accessToken = resp.access_token;
          needsReconnect(false);
          const action = pendingAction;
          pendingAction = null;
          if (action) action(); else flush();
        }
      });
    }

    let pendingAction = null;

    // Silent token request. Safari often blocks the popup this falls back to
    // when it isn't triggered by a tap, so callers must cope with no token.
    function requestTokenSilently(action) {
      initTokenClient();
      if (!tokenClient) return false;
      pendingAction = action || null;
      try {
        tokenClient.requestAccessToken({ prompt: "" });
        return true;
      } catch (e) {
        return false;
      }
    }

    // Called from a real tap, so the popup is allowed through.
    function reconnect() {
      showError("");
      initTokenClient();
      if (!tokenClient) {
        showError("Google sign-in is still loading. Try again in a moment.");
        return;
      }
      accessToken = null;
      setStatus("saving", "Reconnecting…");
      pendingAction = null;
      tokenClient.requestAccessToken({ prompt: "consent" });
    }

    // --- Picker ---

    function loadPicker(cb) {
      if (pickerReady) { cb(); return; }
      if (!window.gapi) {
        showError("Google Picker is still loading. Try again in a moment.");
        return;
      }
      gapi.load("picker", () => { pickerReady = true; cb(); });
    }

    function buildPicker() {
      const view = new google.picker.DocsView(google.picker.ViewId.SPREADSHEETS)
        .setIncludeFolders(true)
        .setSelectFolderEnabled(false);

      return new google.picker.PickerBuilder()
        .setOAuthToken(accessToken)
        .setDeveloperKey(API_KEY)
        .setAppId(APP_ID)
        .addView(view)
        .setCallback((data) => {
          if (data.action !== google.picker.Action.PICKED) return;
          const doc = data.docs[0];
          sheet = { id: doc.id, name: doc.name };
          localStorage.setItem("qrSheet", JSON.stringify(sheet));
          renderSheet();
          flush();
        })
        .build();
    }

    function openPicker() {
      showError("");
      const open = () => loadPicker(() => buildPicker().setVisible(true));
      if (accessToken) {
        open();
      } else {
        // This runs from a tap, so a visible sign-in prompt is fine here.
        initTokenClient();
        if (!tokenClient) {
          showError("Google sign-in is still loading. Try again in a moment.");
          return;
        }
        pendingAction = open;
        tokenClient.requestAccessToken({ prompt: "" });
      }
    }

    // --- Writing rows ---

    function appendRow(email) {
      const url = "https://sheets.googleapis.com/v4/spreadsheets/" +
        encodeURIComponent(sheet.id) +
        "/values/A1:append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS";

      return fetch(url, {
        method: "POST",
        headers: {
          "Authorization": "Bearer " + accessToken,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ values: [[new Date().toISOString(), email]] })
      }).then((res) => {
        if (res.status === 401 || res.status === 403) {
          const err = new Error("auth");
          err.auth = true;
          throw err;
        }
        if (!res.ok) return res.text().then((t) => { throw new Error(t); });
        return res.json();
      });
    }

    // Sends queued scans one at a time; each is dropped only once written.
    function flush() {
      if (flushing) return;
      if (queue.length === 0) { needsReconnect(false); return; }
      if (!sheet) {
        setStatus("failed", "Choose a Google Sheet — " + queue.length + " scan(s) waiting.");
        return;
      }
      if (!accessToken) {
        if (!requestTokenSilently(flush)) queueStatus();
        return;
      }

      flushing = true;
      setStatus("saving", "Saving " + queue.length + " scan(s)…");

      const step = () => {
        if (queue.length === 0) {
          flushing = false;
          needsReconnect(false);
          setStatus("saved", "Saved to " + sheet.name + "<div id=\"scanned\"></div>");
          return;
        }
        const email = queue[0];
        appendRow(email)
          .then(() => {
            queue.shift();
            saveQueue();
            step();
          })
          .catch((err) => {
            flushing = false;
            if (err.auth) {
              accessToken = null;
              if (!requestTokenSilently(flush)) queueStatus();
            } else {
              setStatus("failed", "Could not save — " + queue.length +
                " scan(s) still waiting. They'll be sent when this works again.");
              showError(err.message);
              needsReconnect(true);
            }
          });
      };
      step();
    }

    // --- Scanner ---

    function onScanSuccess(decodedText) {
      if (scanHandled) return;
      scanHandled = true;

      $("qr-reader").style.display = "none";
      $("retry-button").style.display = "block";

      queue.push(decodedText);
      saveQueue();
      setStatus("saving", "Scanned " + decodedText + " — saving…");

      qrCodeScanner.stop().catch((e) => console.error("Error stopping scanner:", e));
      flush();
    }

    function onScanError() { /* fires constantly between frames; ignore */ }

    function startScanner() {
      scanHandled = false;
      $("retry-button").style.display = "none";
      $("qr-reader").style.display = "block";
      if (queue.length === 0) setStatus("", "");

      qrCodeScanner = new Html5Qrcode("qr-reader");
      qrCodeScanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        onScanSuccess,
        onScanError
      ).catch((error) => showError("Failed to start the camera: " + error));
    }

    $("choose-button").addEventListener("click", openPicker);
    $("retry-button").addEventListener("click", startScanner);
    $("reconnect-button").addEventListener("click", reconnect);

    renderSheet();
    queueStatus();
    window.addEventListener("load", () => {
      startScanner();
      if (queue.length > 0 || sheet) requestTokenSilently(flush);
    });
  </script>
</body>
</html>
