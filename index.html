<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Email Capture</title>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      max-width: 520px;
      margin: 0 auto;
    }
    #qr-reader { width: 100%; max-width: 300px; margin: 20px 0; }
    button { padding: 10px 20px; font-size: 1em; margin-top: 12px; }
    #status {
      width: 100%;
      box-sizing: border-box;
      margin-top: 16px;
      padding: 12px;
      border-radius: 6px;
      text-align: center;
      font-size: 1.1em;
      display: none;
    }
    #status.saving { display: block; background: #eee; color: #333; }
    #status.saved  { display: block; background: #e6f4ea; color: #137333; font-weight: bold; }
    #status.failed { display: block; background: #fce8e6; color: #b00; font-weight: bold; }
    .scanned { font-family: monospace; font-size: 0.9em; word-break: break-all; }
    #retry-send-button { display: none; }
    #error { color: #b00; margin-top: 12px; text-align: center; }
  </style>
</head>
<body>
  <h2>Scan QR Code to Capture Email</h2>

  <div id="qr-reader"></div>

  <div id="status"></div>
  <button id="retry-button" style="display: none;">Capture Another</button>
  <button id="retry-send-button">Retry sending</button>
  <div id="error"></div>

  <script>
    // Apps Script web app that appends rows to the spreadsheet.
    // Deployed as "Execute as: me" / "Who has access: anyone", so nobody
    // using this page has to sign in to Google.
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw4NSw86f6q2nHr7STKC0DBkD8zPej0qilYaCl-7YwRIgGhFmpVZAR_ciKTBQsWjb7c/exec";

    let qrCodeScanner = null;
    let scanHandled = false;
    let sending = false;

    const $ = (id) => document.getElementById(id);

    // Every scan lands here first and is removed only once the script
    // confirms the write, so a failure never loses a badge.
    let queue = JSON.parse(localStorage.getItem("qrQueue") || "[]");
    const saveQueue = () => localStorage.setItem("qrQueue", JSON.stringify(queue));

    function showError(msg) { $("error").textContent = msg || ""; }

    function setStatus(kind, html) {
      const el = $("status");
      el.className = kind || "";
      el.innerHTML = html || "";
    }

    function queueWaiting() {
      setStatus("failed",
        "NOT saved yet — " + queue.length + " scan" + (queue.length === 1 ? "" : "s") +
        " waiting.<br>Check your signal, then tap Retry sending.");
      $("retry-send-button").style.display = "block";
    }

    function postEmail(email) {
      return fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({ email: email })
      }).then((res) => {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.text();
      }).then((text) => {
        if (text.trim() !== "ok") throw new Error(text.slice(0, 120));
        return true;
      });
    }

    // Sends queued scans one at a time; each is dropped only once written.
    function flush() {
      if (sending) return;
      if (queue.length === 0) {
        $("retry-send-button").style.display = "none";
        return;
      }

      sending = true;
      showError("");
      setStatus("saving", "Saving " + queue.length + " scan(s)…");

      const step = () => {
        if (queue.length === 0) {
          sending = false;
          $("retry-send-button").style.display = "none";
          setStatus("saved", "Saved to the spreadsheet");
          return;
        }
        const email = queue[0];
        postEmail(email)
          .then(() => {
            queue.shift();
            saveQueue();
            step();
          })
          .catch((err) => {
            sending = false;
            queueWaiting();
            showError(err.message);
          });
      };
      step();
    }

    // --- Scanner ---

    function onScanSuccess(decodedText) {
      if (scanHandled) return;
      scanHandled = true;

      $("qr-reader").style.display = "none";
      $("retry-button").style.display = "block";

      queue.push(decodedText);
      saveQueue();
      setStatus("saving", "Scanned <span class=\"scanned\">" + decodedText + "</span><br>saving…");

      qrCodeScanner.stop().catch((e) => console.error("Error stopping scanner:", e));
      flush();
    }

    function onScanError() { /* fires constantly between frames; ignore */ }

    function startScanner() {
      scanHandled = false;
      $("retry-button").style.display = "none";
      $("qr-reader").style.display = "block";
      if (queue.length === 0) setStatus("", "");

      qrCodeScanner = new Html5Qrcode("qr-reader");
      qrCodeScanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        onScanSuccess,
        onScanError
      ).catch((error) => showError("Failed to start the camera: " + error));
    }

    $("retry-button").addEventListener("click", startScanner);
    $("retry-send-button").addEventListener("click", flush);

    if (queue.length > 0) queueWaiting();
    window.addEventListener("load", () => {
      startScanner();
      flush();
    });
  </script>
</body>
</html>
